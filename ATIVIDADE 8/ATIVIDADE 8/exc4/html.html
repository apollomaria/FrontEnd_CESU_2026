<html>
<head>
    <title> Taxas Infinity Bank </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="todo-app">
        <h2> Taxas Infinity Bank </h2>
        <div style="display: flex; justify-content: center; flex-direction: column;">
            <label for="bandeiras"> Selecione a bandeira do seu cartão: </label>
                <select name="bandeiras" id="bandeiras">
                    <option value="visa"> Visa </option>
                    <option value="master"> Master </option>
                    <option value="elo"> Elo </option>
                </select>
            <br>
            <input type="number" id="valorVenda" placeholder=" Valor da Venda" step="1">
            <br>

            <label for="parcelas"> Selecione a quantidade de parcelas: </label>
                <select name="parcelas" id="parcelas">
                    <option value="1"> 1x </option>
                    <option value="2"> 2x </option>
                    <option value="3"> 3x </option>
                    <option value="4"> 4x </option>
                    <option value="5"> 5x </option>
                    <option value="6"> 6x </option>
                </select>

            <button id="botao" onclick="calcular()"> Calcular Total </button>

            <h2> Resumo da Compra </h2>
            <p id="lugarTaxa"> </p>
            <p id="lugarJuros"> </p>
            <p id="lugarParcela"> </p>
            <p id="lugarTotal"> </p>
        </div>
        
        <p id="situacao"> </p>
    </div>
    <script src="script.js"></script>
</body>
</html>

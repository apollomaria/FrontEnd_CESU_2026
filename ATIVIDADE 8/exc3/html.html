<html>
<head>
    <title> Média Escolar </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="todo-app">
        <h2> Média Escolar </h2>
        <div style="display: flex; justify-content: center; flex-direction: column;">
            <input type="text" id="nome" placeholder=" Nome do Estudante "> <br>
            <input type="number" id="nota1" placeholder=" Valor da Nota 1 " step="0.1">
            <input type="number" id="nota2" placeholder=" Valor da Nota 2 " step="0.1">
            <input type="number" id="nota3" placeholder=" Valor da Nota 3 " step="0.1">
            <button id="botao"> Calcular Média </button>
        </div>
        
        <p id="situacao"> </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
